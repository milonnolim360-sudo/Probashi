<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>প্রবাসী ও যুব ও যুব কল্যাণ সমবায় সমিতি</title>

<!-- Font Awesome - Official Brand Style Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    "Noto Sans Bengali",
    "Segoe UI",
    Arial,
    sans-serif;

    background:#ffffff;
    color:#222;
}

/* =========================
   TOP HEADER
========================= */

.top-header{
    background:
    linear-gradient(145deg,#080808,#1b0d0d,#080808);

    color:white;
    text-align:center;

    padding:45px 15px 35px;

    border-bottom:4px solid #d4af37;

    box-shadow:
    0 8px 25px rgba(0,0,0,.35);
}

.top-header h1{
    font-size:30px;
    color:#f5d76e;

    text-shadow:
    0 2px 4px #000,
    0 0 15px rgba(212,175,55,.35);

    margin-bottom:12px;
}

.top-header p{
    font-size:17px;
    color:#ddd;
}

.gold-line{
    width:92%;
    height:1px;
    background:#d4af37;
    margin:0 auto 30px;
    opacity:.55;
}

/* =========================
   NAVIGATION
========================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;

    background:
    linear-gradient(180deg,#080808,#020202);

    border-bottom:2px solid #c9a227;

    box-shadow:
    0 5px 20px rgba(0,0,0,.5);

    display:flex;
    justify-content:space-around;
    align-items:center;

    padding:12px 5px;
}

.nav-item{
    text-decoration:none;
    color:#eee;

    text-align:center;

    width:20%;

    transition:.3s;
}

.nav-item:hover{
    color:#f5d76e;
    transform:translateY(-3px);
}

.nav-icon{
    width:60px;
    height:60px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:18px;

    background:
    linear-gradient(145deg,#222,#050505);

    border:1px solid #333;

    box-shadow:
    inset 0 2px 5px rgba(255,255,255,.1),
    0 5px 12px rgba(0,0,0,.6);

    font-size:29px;
}

.nav-item span{
    display:block;
    margin-top:7px;
    font-weight:bold;
    font-size:14px;
}

/* =========================
   CENTER LOGO
========================= */

.logo-item{
    margin-top:-35px;
}

.main-logo{
    width:82px;
    height:82px;

    border-radius:50%;

    background:white;

    border:6px solid #d4af37;

    box-shadow:
    0 0 0 5px #087f38,
    0 0 20px rgba(212,175,55,.7),
    inset 0 0 15px rgba(0,0,0,.25);

    object-fit:cover;
}

.logo-text{
    color:#f5d76e !important;
}

/* =========================
   MAIN
========================= */

main{
    width:100%;
    max-width:1100px;
    margin:auto;

    padding:35px 15px 60px;
}

.section-title{
    text-align:center;
    margin-bottom:25px;
}

.section-title h2{
    font-size:27px;
    color:#151515;
}

.section-title .underline{
    width:90px;
    height:4px;
    background:#d4af37;
    margin:10px auto;
    border-radius:10px;
}

/* =========================
   PROFILE / CONTACT
========================= */

.contact-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

    margin-bottom:35px;
}

.contact-card{
    background:
    linear-gradient(145deg,#ffffff,#f4f4f4);

    border:1px solid #ddd;

    border-top:4px solid #d4af37;

    border-radius:18px;

    padding:22px;

    text-align:center;

    box-shadow:
    0 8px 20px rgba(0,0,0,.1);
}

.contact-card i{
    font-size:35px;
    margin-bottom:10px;
}

.whatsapp-icon{
    color:#25D366;
}

.profile-icon{
    color:#222;
}

.contact-card h3{
    margin-bottom:8px;
}

.contact-card a{
    color:#087f38;
    font-weight:bold;
    text-decoration:none;
    word-break:break-word;
}

/* =========================
   SERVICE CARDS
========================= */

.services{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;
}

.service-card{
    position:relative;

    background:
    linear-gradient(145deg,#ffffff,#f3f3f3);

    border-radius:22px;

    padding:25px 18px;

    text-align:center;

    text-decoration:none;

    color:#222;

    border:1px solid #ddd;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

    transition:.3s;
}

.service-card:hover{
    transform:
    translateY(-7px)
    scale(1.01);

    border-color:#d4af37;

    box-shadow:
    0 15px 30px rgba(0,0,0,.2);
}

.service-icon{
    width:75px;
    height:75px;

    margin:auto auto 15px;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(145deg,#111,#333);

    color:#f5d76e;

    font-size:35px;

    box-shadow:
    inset 0 2px 5px rgba(255,255,255,.15),
    0 7px 15px rgba(0,0,0,.35);
}

.service-card h3{
    font-size:20px;
    margin-bottom:7px;
}

.service-card p{
    color:#666;
    font-size:14px;
}

/* =========================
   SOCIAL
========================= */

.social-section{
    margin-top:45px;
}

.social-grid{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);

    gap:18px;
}

.social-card{
    text-decoration:none;

    padding:25px 12px;

    text-align:center;

    border-radius:18px;

    color:white;

    background:
    linear-gradient(145deg,#151515,#050505);

    border:1px solid #333;

    box-shadow:
    0 8px 18px rgba(0,0,0,.25);

    transition:.3s;
}

.social-card:hover{
    transform:translateY(-5px);
}

.social-card i{
    font-size:42px;
    margin-bottom:10px;
}

.facebook i{
    color:#1877F2;
}

.youtube i{
    color:#FF0000;
}

.whatsapp i{
    color:#25D366;
}

.social-card h3{
    color:white;
}

/* =========================
   THREE MEMBER PHOTOS
========================= */

.members{
    margin-top:50px;
}

.member-grid{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);

    gap:20px;
}

.member-card{
    background:white;

    border-radius:20px;

    overflow:hidden;

    border:1px solid #ddd;

    box-shadow:
    0 8px 20px rgba(0,0,0,.13);

    transition:.3s;
}

.member-card:hover{
    transform:translateY(-5px);
}

.member-name{
    text-align:center;

    background:
    linear-gradient(135deg,#111,#251d0b);

    color:#f5d76e;

    padding:12px;

    font-weight:bold;

    font-size:17px;
}

.member-photo{
    width:100%;
    height:300px;

    display:block;

    object-fit:cover;

    background:#eee;
}

/* =========================
   LOGIN / REGISTRATION
========================= */

.account-box{
    margin-top:45px;

    background:
    linear-gradient(145deg,#0b0b0b,#21190b);

    color:white;

    border-radius:25px;

    padding:30px 20px;

    text-align:center;

    border:2px solid #d4af37;

    box-shadow:
    0 12px 30px rgba(0,0,0,.3);
}

.account-box h2{
    color:#f5d76e;
    margin-bottom:12px;
}

.account-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    margin-top:20px;
}

.account-btn{
    display:inline-block;

    padding:13px 25px;

    border-radius:30px;

    background:#d4af37;

    color:#111;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

.account-btn:hover{
    background:#f5d76e;
    transform:scale(1.04);
}

/* =========================
   FOOTER
========================= */

footer{
    background:
    linear-gradient(145deg,#080808,#1b0d0d,#080808);

    color:#ddd;

    text-align:center;

    padding:35px 15px;

    border-top:3px solid #d4af37;
}

footer h3{
    color:#f5d76e;

    margin-bottom:10px;

    font-size:21px;
}

footer p{
    margin:7px 0;
}

.footer-gold{
    color:#d4af37;
    font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top-header{
        padding:35px 10px 28px;
    }

    .top-header h1{
        font-size:22px;
    }

    .top-header p{
        font-size:14px;
    }

    .navbar{
        padding:10px 2px;
    }

    .nav-icon{
        width:48px;
        height:48px;

        border-radius:14px;

        font-size:22px;
    }

    .nav-item span{
        font-size:11px;
    }

    .logo-item{
        margin-top:-27px;
    }

    .main-logo{
        width:70px;
        height:70px;
        border-width:5px;
    }

    .contact-box{
        grid-template-columns:1fr;
    }

    .services{
        grid-template-columns:1fr;
    }

    .social-grid{
        grid-template-columns:1fr;
    }

    .member-grid{
        grid-template-columns:1fr;
    }

    .member-photo{
        height:350px;
    }

    .section-title h2{
        font-size:23px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <div class="gold-line"></div>

    <h1>
        প্রবাসী ও যুব ও যুব কল্যাণ সমবায় সমিতি
    </h1>

    <p>
        ঐক্য • সেবা • উন্নয়ন
    </p>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<nav
