<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">

<defs>

  <radialGradient id="gold" cx="30%" cy="20%">
    <stop offset="0%" stop-color="#fff3b0"/>
    <stop offset="35%" stop-color="#e8bd55"/>
    <stop offset="75%" stop-color="#b77b18"/>
    <stop offset="100%" stop-color="#68420b"/>
  </radialGradient>

  <radialGradient id="green" cx="30%" cy="20%">
    <stop offset="0%" stop-color="#21b982"/>
    <stop offset="55%" stop-color="#08734e"/>
    <stop offset="100%" stop-color="#02271a"/>
  </radialGradient>

  <filter id="shadow">
    <feDropShadow
      dx="0"
      dy="18"
      stdDeviation="18"
      flood-opacity=".35"/>
  </filter>

</defs>


<!-- GOLD 3D OUTER -->
<circle
  cx="400"
  cy="400"
  r="350"
  fill="url(#gold)"
  filter="url(#shadow)"
/>


<!-- WHITE INNER BORDER -->
<circle
  cx="400"
  cy="400"
  r="315"
  fill="none"
  stroke="#ffffff"
  stroke-width="12"
/>


<!-- GREEN CENTER -->
<circle
  cx="400"
  cy="400"
  r="245"
  fill="url(#green)"
/>


<!-- TOP BANGLA -->
<text
  x="400"
  y="190"
  text-anchor="middle"
  fill="#fff0a0"
  font-size="54"
  font-weight="900"
  font-family="Noto Sans Bengali, sans-serif">

  প্রবাসী মানব কল্যাণ

</text>


<!-- HUMAN / UNITY ICON -->

<circle
  cx="400"
  cy="370"
  r="95"
  fill="none"
  stroke="#ffffff"
  stroke-width="8"
/>


<!-- PEOPLE -->

<circle cx="350" cy="350" r="25" fill="#ffffff"/>
<circle cx="450" cy="350" r="25" fill="#ffffff"/>

<path
  d="M300 440
     Q350 390 400 440
     Q450 390 500 440"
  fill="none"
  stroke="#ffffff"
  stroke-width="24"
  stroke-linecap="round"
/>


<!-- HEART -->

<path
  d="M400 475
     C350 430 320 405 320 375
     C320 345 355 330 400 370
     C445 330 480 345 480 375
     C480 405 450 430 400 475Z"
  fill="#d92828"
  stroke="#ffffff"
  stroke-width="6"
/>


<!-- ENGLISH -->

<text
  x="400"
  y="610"
  text-anchor="middle"
  fill="#ffffff"
  font-size="37"
  font-weight="800"
  font-family="Arial, sans-serif">

  PROBASHI HUMAN WELFARE

</text>


<text
  x="400"
  y="660"
  text-anchor="middle"
  fill="#ffe49a"
  font-size="31"
  font-weight="700"
  font-family="Arial, sans-serif">

  COOPERATIVE SOCIETY

</text>


<!-- DECORATIVE RING -->

<circle
  cx="400"
  cy="400"
  r="285"
  fill="none"
  stroke="#ffe49a"
  stroke-width="3"
  stroke-dasharray="8 12"
/>

</svg>
