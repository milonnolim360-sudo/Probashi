<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d1117, #161b22, #1f2937);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-in-out;
        }

        /* 3D Bangla Title Header */
        .bangla-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 
                0 1px 0 #00c6ff,
                0 2px 0 #00a3d9,
                0 3px 0 #0080b2,
                0 4px 0 #005d8b,
                0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            animation: pulse 2.5s infinite alternate;
        }

        /* English Title Below Bangla */
        .english-title {
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* bKash 3D Card Area */
        .bkash-card {
            background: linear-gradient(145deg, #e2136e, #b80c55);
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(226, 19, 110, 0.4);
            margin-bottom: 30px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .bkash-card:hover {
            transform: translateY(-5px);
        }

        .bkash-icon {
            width: 38px;
            height: 38px;
            background: #ffffff;
            color: #e2136e;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .bkash-text {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Important Links Section */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: block;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #00f2fe;
            color: #0d1117;
            box-shadow: 0 0 15px #00f2fe;
            transform: scale(1.02);
        }

        .btn-gov {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
        }

        .btn-gov:hover {
            background: #10b981;
            box-shadow: 0 0 15px #10b981;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- বাংলা নাম (উপরে) -->
        <h1 class="bangla-title">বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন </h1>
        
        <!-- ইংরেজি নাম (নিচে) -->
        <p class="english-title">Bangladesh Probashi Fund Club</p>

        <!-- বিকাশ আইকন ও নম্বর -->
        <div class="bkash-card">
            <div class="bkash-icon">ব</div>
            <div class="bkash-text">বিকাশ: +8801961704927</div>
        </div>

        <!-- সকল প্রয়োজনীয় লিংক -->
        <div class="links-container">
            <a href="https://www.facebook.com/share/g/1LGXj4cECY/" class="btn-link" target="_blank">অফিসিয়াল ফেসবুক গ্রুপ</a>
            <a href="https://www.youtube.com/@Bangladeshprobashifundclubf" class="btn-link" target="_blank">ইউটিউব চ্যানেল</a>
            <a href="https://chat.whatsapp.com/D09urUItfkdEjiVtqgIbY7" class="btn-link" target="_blank">হোয়াটসঅ্যাপ গ্রুপ</a>
            <a href="https://wa.me/8801928807515" class="btn-link" target="_blank">হোয়াটসঅ্যাপ যোগাযোগ (+8801928807515)</a>
            <a href="https://everify.bdris.gov.bd/" class="btn-link btn-gov" target="_blank">জন্ম নিবন্ধন যাচাই (BDRIS)</a>
            <a href="https://www.expatservicesmy.com/ESKLPublicportal/Appointment/BookAppointment" class="btn-link btn-gov" target="_blank">Expat Services KL Appointment</a>
        </div>
    </div>

</body>
</html>
