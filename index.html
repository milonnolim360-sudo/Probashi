<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNG ডিপোজিট ও উইথড্র পোর্টাল</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-4xl w-full flex flex-col md:flex-row">
    
    <!-- বাম পাশ: ওয়ালেট ব্যালেন্স ও হিস্ট্রি -->
    <div class="md:w-5/12 bg-gradient-to-br from-blue-700 to-indigo-900 text-white p-8 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold mb-6 border-b border-blue-500/40 pb-2">মাই ওয়ালেট</h2>
        
        <!-- বর্তমান ব্যালেন্স -->
        <div class="bg-white/10 backdrop-blur-md rounded-xl p-4 mb-6 border border-white/10">
          <p class="text-xs text-blue-200 uppercase font-semibold">বর্তমান ব্যালেন্স</p>
          <p class="text-3xl font-extrabold mt-1">RM ২৫০.০০</p>
        </div>

        <!-- সর্বশেষ লেনদেন -->
        <div class="space-y-3">
          <p class="text-sm font-semibold text-blue-200">সর্বশেষ লেনদেন</p>
          <div class="flex justify-between items-center text-xs bg-white/5 p-2.5 rounded-lg border border-white/5">
            <span>ডিপোজিট (TNG eWallet)</span>
            <span class="text-emerald-400 font-bold">+RM ৫০.০০</span>
          </div>
          <div class="flex justify-between items-center text-xs bg-white/5 p-2.5 rounded-lg border border-white/5">
            <span>উইথড্র (Bank Transfer)</span>
            <span class="text-rose-400 font-bold">-RM ২০.০০</span>
          </div>
        </div>
      </div>

      <div class="mt-8 text-xs text-blue-200 text-center">
        নিরাপদ ও দ্রুত লেনদেন ব্যবস্থা
      </div>
    </div>

    <!-- ডান পাশ: ডিপোজিট ও উইথড্র ফর্ম -->
    <div class="md:w-7/12 w-full p-8">
      
      <!-- ট্যাব সুইচ (ডিপোজিট / উইথড্র) -->
      <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
        <button id="tab-deposit" onclick="switchTab('deposit')" class="w-1/2 py-2.5 text-sm font-bold rounded-lg bg-blue-600 text-white transition duration-200">
          ডিপোজিট (টাকা জমা)
        </button>
        <button id="tab-withdraw" onclick="switchTab('withdraw')" class="w-1/2 py-2.5 text-sm font-bold rounded-lg text-gray-600 hover:text-gray-900 transition duration-200">
          উইথড্র (টাকা তোলা)
        </button>
      </div>

      <!-- ১. ডিপোজিট ফর্ম -->
      <form id="form-deposit" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">পেমেন্ট মেথড নির্বাচন করুন</label>
          <select id="deposit-method" onchange="toggleMethodDetails()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="tng">Touch 'n Go (TNG QR)</option>
            <option value="nagad">নগদ (Nagad)</option>
            <option value="rocket">রকেট (Rocket)</option>
            <option value="bank">অনলাইন ব্যাংক ট্রান্সফার</option>
          </select>
        </div>

        <!-- TNG QR Code সেকশন (ডিফল্টভাবে প্রদর্শিত হবে) -->
        <div id="tng-qr-box" class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
          <p class="text-xs text-blue-800 font-semibold mb-2">Touch 'n Go স্ক্যান করে পেমেন্ট করুন</p>
          <div class="bg-white p-2 inline-block rounded-lg shadow-sm border border-gray-200">
            <!-- এখানে আপনার আসল TNG QR কোডের ইমেজ লিংক বসাবেন -->
            <img 
              src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TNG_PAYMENT_DEMO" 
              alt="TNG QR Code" 
              class="w-36 h-36 mx-auto object-contain"
            />
          </div>
          <p class="text-xs text-gray-500 mt-2">স্ক্যান করার পর নিচের ফর্মে Ref No/TrxID টি লিখুন</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">ডিপোজিটের পরিমাণ</label>
          <input type="number" placeholder="যেমন: ২৫০" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">ট্রানজেকশন আইডি / Ref No</label>
          <input type="text" placeholder="যেমন: TNG12345678" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
        </div>

        <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
          কনফার্ম ডিপোজিট
        </button>
      </form>

      <!-- ২. উইথড্র ফর্ম (প্রাথমিকভাবে হাইড করা) -->
      <form id="form-withdraw" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">টাকা গ্রহণের মেথড</label>
          <select class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="tng">Touch 'n Go (TNG eWallet)</option>
            <option value="nagad">নগদ (Nagad)</option>
            <option value="rocket">রকেট (Rocket)</option>
            <option value="bank">ব্যাংক একাউন্ট (Bank)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">উইথড্র এর পরিমাণ</label>
          <input type="number" placeholder="সর্বনিম্ন ৫০" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">আপনার TNG ওয়ালেট / অ্যাকাউন্ট নম্বর</label>
          <input type="text" placeholder="01X-XXXXXXX" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
        </div>

        <button type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
          উইথড্র রিকোয়েস্ট পাঠান
        </button>
      </form>

    </div>
  </div>

  <!-- JavaScript: ট্যাব এবং QR কোড লজিক -->
  <script>
    function switchTab(type) {
      const depositTab = document.getElementById('tab-deposit');
      const withdrawTab = document.getElementById('tab-withdraw');
      const depositForm = document.getElementById('form-deposit');
      const withdrawForm = document.getElementById('form-withdraw');

      if (type === 'deposit') {
        depositTab.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg bg-blue-600 text-white transition duration-200";
        withdrawTab.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg text-gray-600 hover:text-gray-900 transition duration-200";
        depositForm.classList.remove('hidden');
        withdrawForm.classList.add('hidden');
      } else {
        withdrawTab.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg bg-emerald-600 text-white transition duration-200";
        depositTab.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg text-gray-600 hover:text-gray-900 transition duration-200";
        withdrawForm.classList.remove('hidden');
        depositForm.classList.add('hidden');
      }
    }

    function toggleMethodDetails() {
      const method = document.getElementById('deposit-method').value;
      const qrBox = document.getElementById('tng-qr-box');
      
      if (method === 'tng') {
        qrBox.classList.remove('hidden');
      } else {
        qrBox.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
