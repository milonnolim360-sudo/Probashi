<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>প্রবাসী ও যুব কল্যাণ সমবায় সমিতি</title>

<meta name="description"
content="প্রবাসী ও যুব কল্যাণ সমবায় সমিতি - ঐক্য, সহযোগিতা, উন্নয়ন ও কল্যাণ">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --primary:#0759ff;
    --secondary:#00b7ff;
    --green:#16a34a;
    --dark:#07113f;
    --text:#101a45;
    --bg:#eef3ff;
    --card:rgba(255,255,255,.88);
    --shadow:0 15px 40px rgba(0,40,120,.16);
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

body.dark{
    --text:#fff;
    --bg:#071126;
    --card:rgba(20,32,65,.92);
    --shadow:0 15px 40px rgba(0,0,0,.4);
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(15px);
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.dark header{
    background:rgba(7,17,38,.92);
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    box-shadow:0 8px 20px rgba(0,80,255,.25);
}

.logo-text h2{
    font-size:19px;
    color:var(--primary);
}

.logo-text small{
    font-size:12px;
}

nav{
    display:flex;
    align-items:center;
    gap:7px;
}

nav a{
    text-decoration:none;
    color:var(--text);
    font-weight:bold;
    font-size:13px;
    padding:8px 10px;
    border-radius:20px;
}

nav a:hover{
    background:var(--primary);
    color:white;
}

.theme-btn{
    border:0;
    background:var(--dark);
    color:white;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

/* HERO */
.hero{
    max-width:1200px;
    margin:25px auto;
    padding:70px 45px;
    min-height:570px;
    border-radius:35px;
    position:relative;
    overflow:hidden;
    color:white;
    background:
    radial-gradient(circle at 80% 20%,#277dff,transparent 25%),
    radial-gradient(circle at 20% 90%,#00d4ff,transparent 25%),
    linear-gradient(135deg,#06166b,#0039c9,#07104a);
    box-shadow:0 25px 70px rgba(0,40,160,.35);
    display:flex;
    align-items:center;
}

.hero:before,
.hero:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    animation:float 7s infinite ease-in-out;
}

.hero:before{
    width:300px;
    height:300px;
    right:-80px;
    top:-100px;
}

.hero:after{
    width:180px;
    height:180px;
    left:-60px;
    bottom:-60px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:650px;
}

.badge{
    display:inline-block;
    padding:8px 17px;
    border-radius:30px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.35);
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(38px,6vw,68px);
    line-height:1.15;
    margin-bottom:20px;
}

.hero h1 span{
    color:#00eaff;
}

.hero p{
    font-size:18px;
    max-width:620px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:28px;
}

.btn{
    display:inline-block;
    padding:13px 22px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    border:0;
    cursor:pointer;
    font-size:15px;
}

.btn-primary{
    background:white;
    color:#0759ff;
}

.btn-green{
    background:#19c763;
    color:white;
}

.btn-blue{
    background:#0759ff;
    color:white;
}

.hero-3d{
    position:absolute;
    right:5%;
    bottom:25px;
    width:340px;
    height:340px;
    border-radius:50%;
    background:radial-gradient(circle,#ffffff 0 8%,#4ad8ff 9% 11%,transparent 12%);
    box-shadow:
    0 0 50px #00cfff,
    inset 0 0 60px rgba(255,255,255,.5);
    opacity:.9;
    animation:spin 15s linear infinite;
}

/* STATS */
.stats{
    max-width:1100px;
    margin:-65px auto 60px;
    position:relative;
    z-index:5;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:var(--card);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.stat{
    text-align:center;
    padding:25px 10px;
    border-right:1px solid rgba(100,100,100,.15);
}

.stat:last-child{
    border:0;
}

.stat .icon{
    font-size:38px;
}

.stat h2{
    color:var(--primary);
    font-size:28px;
}

/* SECTIONS */
section{
    max-width:1200px;
    margin:80px auto;
    padding:0 20px;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title small{
    color:var(--primary);
    font-weight:bold;
}

.section-title h2{
    font-size:38px;
}

.section-title p{
    max-width:700px;
    margin:auto;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:var(--card);
    border-radius:25px;
    padding:25px;
    box-shadow:var(--shadow);
    transition:.4s;
    border:1px solid rgba(255,255,255,.3);
}

.card:hover{
    transform:translateY(-12px) rotateX(2deg);
}

.card-icon{
    width:75px;
    height:75px;
    margin:auto auto 15px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(145deg,#fff,#dce8ff);
    box-shadow:8px 8px 20px rgba(0,50,150,.15);
}

.card h3{
    text-align:center;
    margin-bottom:8px;
}

/* PROGRAM */
.program-card{
    min-height:260px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:end;
    background:linear-gradient(145deg,#0837d5,#00a9e8);
}

.program-card:nth-child(2){
    background:linear-gradient(145deg,#00796b,#00bfa5);
}

.program-card:nth-child(3){
    background:linear-gradient(145deg,#1748a8,#0789ff);
}

.program-card:nth-child(4){
    background:linear-gradient(145deg,#f97316,#ffb300);
}

/* MEMBERS */
.member-box{
    max-width:750px;
    margin:auto;
    background:var(--card);
    padding:30px;
    border-radius:25px;
    box-shadow:var(--shadow);
}

input,select,textarea{
    width:100%;
    padding:13px 15px;
    margin:7px 0 15px;
    border-radius:12px;
    border:1px solid #ccd5eb;
    background:white;
    font-size:15px;
}

.dark input,
.dark select,
.dark textarea{
    background:#111d3c;
    color:white;
    border-color:#39466a;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.member-list{
    margin-top:25px;
}

.member{
    display:flex;
    justify-content:space-between;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(
