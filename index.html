<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a08">
<meta name="description" content="Probashi & Youth Welfare Cooperative Society">
<title>Probashi & Youth Welfare Cooperative Society</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,205,30,.13),transparent 25%),
    radial-gradient(circle at 10% 50%,rgba(255,190,0,.05),transparent 25%),
    #050706;
  color:#fff;
  min-height:100vh;
}

button,a{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding-bottom:95px;
}

/* TOP BAR */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  background:rgba(5,7,6,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,210,30,.18);
}

.round-btn{
  width:48px;
  height:48px;
  border:1px solid #dcb900;
  border-radius:50%;
  background:rgba(15,16,14,.9);
  color:#ffd51b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(255,210,0,.12);
}

.round-btn:active{
  transform:scale(.92);
}

/* HERO */
.hero{
  text-align:center;
  padding:35px 15px 25px;
}

.logo{
  width:150px;
  height:150px;
  object-fit:contain;
  border-radius:50%;
  padding:7px;
  border:4px solid #ffd21a;
  background:#10120f;
  box-shadow:
    0 0 12px #ffd21a,
    0 0 40px rgba(255,205,20,.35);
  animation:floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

.hero h1{
  margin-top:25px;
  color:#ffd21a;
  font-size:clamp(27px,6vw,52px);
  line-height:1.25;
  text-shadow:
    0 0 5px #ffd21a,
    0 0 18px rgba(255,210,20,.45);
}

.hero h2{
  margin-top:10px;
  color:#ddd;
  font-size:clamp(14px,3vw,21px);
  font-weight:400;
  letter-spacing:.4px;
}

.info{
  margin-top:18px;
  color:#cfcfcf;
  font-size:15px;
}

.info span{
  margin:0 7px;
}

/* SHARE */
.share-area{
  display:flex;
  justify-content:center;
  margin:5px 15px 25px;
}

.share-btn{
  border:1px solid #ffd21a;
  background:linear-gradient(145deg,#1a1b18,#080a09);
  color:#ffd21a;
  border-radius:30px;
  padding:13px 25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 18px rgba(255,210,20,.12);
}

.share-btn:active{
  transform:scale(.96);
}

/* SECTION */
.section-title{
  text-align:center;
  color:#ffd21a;
  font-size:20px;
  margin:15px 0 18px;
  letter-spacing:1px;
}

/* FEATURE GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:0 18px;
}

.card{
  position:relative;
  min-height:220px;
  border:1px solid rgba(255,210,20,.55);
  border-radius:25px;
  background:
    linear-gradient(145deg,rgba(31,34,31,.9),rgba(7,9,8,.98));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px 10px 15px;
  overflow:hidden;
  transition:.25s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 8px 25px rgba(0,0,0,.35);
}

.card::before{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  background:rgba(255,210,20,.07);
  filter:blur(25px);
  top:-40px;
  right:-30px;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 28px rgba(255,210,20,.18);
}

.number{
  position:absolute;
  top:10px;
  left:10px;
  width:39px;
  height:39px;
  border:2px solid #ffd21a;
  color:#ffd21a;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:18px;
  background:#0c0e0c;
}

.icon{
  width:82px;
  height:82px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
  margin-bottom:15px;
  border:3px solid rgba(255,255,255,.55);
  box-shadow:
    inset 0 4px 7px rgba(255,255,255,.3),
    0 7px 15px rgba(0,0,0,.5);
}

.blue{background:linear-gradient(145deg,#3587ff,#0753ca)}
.red{background:linear-gradient(145deg,#ff3434,#bd0000)}
.green{background:linear-gradient(145deg,#22ce6b,#008f45)}
.gray{background:linear-gradient(145deg,#555,#111)}
.orange{background:linear-gradient(145deg,#eaa21c,#a85e00)}
.cyan{background:linear-gradient(145deg,#29bde0,#087e9c)}
.purple{background:linear-gradient(145deg,#9b58ff,#4816a0)}

.card-title{
  text-align:center;
  font-size:16px;
  font-weight:bold;
  line-height:1.3;
}

.card-arrow{
  position:absolute;
  right:10px;
  bottom:10px;
  width:35px;
  height:35px;
  border:1px solid #ffd21a;
  color:#ffd21a;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  z-index:150;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(1100px,100%);
  height:78px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(5,7,6,.94);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,210,20,.45);
  border-bottom:0;
  border-radius:25px 25px 0 0;
}

.nav-btn{
  border:0;
  background:none;
  color:#888;
  font-size:12px;
  cursor:pointer;
}

.nav-icon{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.nav-btn.active{
  color:#ffd21a;
}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid #ffd21a;
  border-radius:28px;
  background:linear-gradient(145deg,#171916,#060807);
  padding:25px;
  box-shadow:0 0 50px rgba(255,210,20,.18);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  color:#ffd21a;
}

.close{
  border:0;
  background:none;
  color:#aaa;
  font-size:28px;
  cursor:pointer;
}

.input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:1px solid #685b16;
  border-radius:14px;
  background:#0b0d0b;
  color:#fff;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#ffd21a;
}

.gold-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:15px;
  background:#ffd21a;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:5px;
}

.admin-item{
  border:1px solid #403b1a;
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.admin-item label{
  display:block;
  color:#ffd21a;
  margin-bottom:8px;
  font-weight:bold;
}

.danger{
  background:#a40000;
  color:#fff;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#ff7070;
  min-height:20px;
}

/* TOAST */
.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(20px);
  background:#ffd21a;
  color:#111;
  padding:13px 20px;
  border-radius:30px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */
@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .card{
    min-height:205px;
  }
}

@media(max-width:430px){
  .hero{
    padding-top:25px;
  }

  .logo{
    width:135px;
    height:135px;
  }

  .grid{
    gap:10px;
    padding:0 12px;
  }

  .card{
    min-height:190px;
    border-radius:20px;
  }

  .icon{
    width:72px;
    height:72px;
    font-size:32px;
  }

  .card-title{
    font-size:14px;
  }

  .bottom-nav{
    height:73px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <button class="round-btn" onclick="showMenu()">☰</button>

    <button class="round-btn" onclick="openAdmin()">
      ⚙
    </button>
  </header>

  <section class="hero">

    <img id="logo"
         class="logo"
         src=""
         alt="BPM Logo">

    <h1 id="orgBn">প্রবাসী ও যুব কল্যাণ সমবায় সমিতি</h1>

    <h2 id="orgEn">
      PROBASHI &amp; YOUTH WELFARE COOPERATIVE SOCIETY
    </h2>

    <div class="info">
      ✥ <span id="location">কলারাপুর মালয়েশিয়া</span>
      ▣ <span id="date">01.01.2026</span>
    </div>

  </section>

  <div class="share-area">
    <button class="share-btn" onclick="shareSite()">
      📤 Share Website
    </button>
  </div>

  <h3 class="section-title">FEATURES</h3>

  <main class="grid" id="featureGrid"></main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-btn active" onclick="scrollHome()">
    <span class="nav-icon">⌂</span>
    Home
  </button>

  <button class="nav-btn" onclick="showToast('Services section coming soon')">
    <span class="nav-icon">▦</span>
    Services
  </button>

  <button class="nav-btn" onclick="openAdmin()">
    <span class="nav-icon">♟</span>
    Admin
  </button>

  <button class="nav-btn" onclick="showToast('Gallery section coming soon')">
    <span class="nav-icon">▧</span>
    Gallery
  </button>

  <button class="nav-btn" onclick="showToast('Contact section coming soon')">
    <span class="nav-icon">☎</span>
    Contact
  </button>

</nav>

<!-- ADMIN LOGIN -->
<div class="modal" id="loginModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>🔐 Admin Login</h2>
      <button class="close" onclick="closeModal('loginModal')">×</button>
    </div>

    <p style="color:#aaa;margin-bottom:15px">
      Admin Username &amp; Password দিয়ে প্রবেশ করুন
    </p>

    <input
      id="adminUser"
      class="input"
      type="text"
      placeholder="Admin Username">

    <input
      id="adminPass"
      class="input"
      type="password"
      placeholder="Password">

    <button class="gold-btn" onclick="loginAdmin()">
      LOGIN
    </button>

    <div class="status" id="loginStatus"></div>

  </div>
</div>

<!-- ADMIN PANEL -->
<div class="modal" id="adminModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>⚙ Admin Panel</h2>
      <button class="close" onclick="closeModal('adminModal')">×</button>
    </div>

    <div class="admin-item">
      <label>Organization Bengali Name</label>
      <input id="editBn" class="input" type="text">
    </div>

    <div class="admin-item">
      <label>Organization English Name</label>
      <input id="editEn" class="input" type="text">
    </div>

    <div class="admin-item">
      <label>Location</label>
      <input id="editLocation" class="input" type="text">
    </div>

    <div class="admin-item">
      <label>Established Date</label>
      <input id="editDate" class="input" type="text">
    </div>

    <div class="admin-item">
      <label>Change Logo</label>
      <input id="logoUpload"
             class="input"
             type="file"
             accept="image/*"
             onchange="changeLogo(event)">
    </div>

    <div id="adminLinks"></div>

    <button class="gold-btn" onclick="saveAdminChanges()">
      💾 SAVE ALL CHANGES
    </button>

    <button class="gold-btn danger" onclick="adminLogout()">
      LOGOUT
    </button>

  </div>
</div>

<!-- MENU -->
<div class="modal" id="menuModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>☰ Menu</h2>
      <button class="close" onclick="closeModal('menuModal')">×</button>
    </div>

    <button class="gold-btn" onclick="shareSite()">
      📤 Share Website
    </button>

    <button class="gold-btn"
            style="margin-top:12px"
            onclick="openAdmin()">
      🔐 Admin Panel
    </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   ADMIN LOGIN
   ===================================================== */

const ADMIN_USERNAME = "MDRAFIK1987";
const ADMIN_PASSWORD = "BPM@2026!";

/* =====================================================
   DEFAULT DATA
   ===================================================== */

const defaultData = {

  bn: "প্রবাসী ও যুব কল্যাণ সমবায় সমিতি",

  en: "PROBASHI & YOUTH WELFARE COOPERATIVE SOCIETY",

  location: "কলারাপুর মালয়েশিয়া",

  date: "01.01.2026",

  logo: "",

  features: [

    {
      name:"Facebook Page",
      icon:"f",
      color:"blue",
      url:"https://www.facebook.com/"
    },

    {
      name:"YouTube",
      icon:"▶",
      color:"red",
      url:"https://youtube.com/"
    },

    {
      name:"TikTok",
      icon:"♪",
      color:"gray",
      url:"https://www.tiktok.com/"
    },

    {
      name:"Facebook Group",
      icon:"f",
      color:"blue",
      url:"https://www.facebook.com/"
    },

    {
      name:"WhatsApp Group",
      icon:"◉",
      color:"green",
      url:"https://chat.whatsapp.com/E9qoK3d1TkV5F6hAapJTZ7"
    },

    {
      name:"WhatsApp Channel",
      icon:"◔",
      color:"green",
      url:"https://whatsapp.com/channel/0029VbCDjt4AO7RBkV1kZg3s"
    },

    {
      name:"WhatsApp Contact",
      icon:"☎",
      color:"green",
      url:"https://wa.me/qr/7ZZMIOTFMIX5G1"
    },

    {
      name:"Appointment",
      icon:"□",
      color:"blue",
      url:"#"
    },

    {
      name:"eVerify",
      icon:"✓",
      color:"blue",
      url:"#"
    },

    {
      name:"News & Notice",
      icon:"▤",
      color:"purple",
      url:"#"
    },

    {
      name:"Donation",
      icon:"♥",
      color:"orange",
      url:"#"
    },

    {
      name:"Location",
      icon:"●",
      color:"cyan",
      url:"#"
    },

    {
      name:"Contact & Support",
      icon:"☎",
      color:"blue",
      url:"https://wa.me/qr/5SBSJ55KMO7CB1"
    }

  ]
};


/* =====================================================
   LOAD DATA
   ===================================================== */

let data;

try{

  const saved = localStorage.getItem("BPM_FINAL_DATA");

  if(saved){
    data = JSON.parse(saved);
  }else{
    data = JSON.parse(JSON.stringify(defaultData));
  }

}catch(e){

  data = JSON.parse(JSON.stringify(defaultData));

}


/* =====================================================
   LOGO
   ===================================================== */

function createDefaultLogo(){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="300"
       height="300"
       viewBox="0 0 300 300">

    <defs>
      <radialGradient id="g">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="65%" stop-color="#fff"/>
        <stop offset="66%" stop-color="#e5c21c"/>
        <stop offset="100%" stop-color="#c79f00"/>
      </radialGradient>
    </defs>

    <circle cx="150" cy="150" r="143"
            fill="#0b0c0b"
            stroke="#ffd21a"
            stroke-width="8"/>

    <circle cx="150" cy="150" r="105"
            fill="url(#g)"
            stroke="#d3ad16"
            stroke-width="5"/>

    <text x="150"
          y="170"
          text-anchor="middle"
          font-size="65"
          font-family="Arial"
          font-weight="bold"
          fill="#176b48">
      BPM
    </text>

  </svg>
  `;

  return "data:image/svg+xml;charset=UTF-8," +
         encodeURIComponent(svg);
}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

  document.getElementById("orgBn").textContent = data.bn;

  document.getElementById("orgEn").textContent = data.en;

  document.getElementById("location").textContent = data.location;

  document.getElementById("date").textContent = data.date;

  document.getElementById("logo").src =
    data.logo || createDefaultLogo();


  const grid =
    document.getElementById("featureGrid");

  grid.innerHTML = "";


  data.features.forEach((item,index)=>{

    const card = document.createElement("a");

    card.className = "card";

    card.href =
      item.url && item.url !== "#"
      ? item.url
      : "javascript:void(0)";

    if(item.url && item.url !== "#"){
      card.target="_blank";
      card.rel="noopener noreferrer";
    }else{
      card.onclick=()=>{
        showToast("এই লিংকটি Admin Panel থেকে যোগ করুন");
      };
    }


    card.innerHTML = `

      <div class="number">
        ${index+1}
      </div>

      <div class="icon ${item.color}">
        ${item.icon}
      </div>

      <div class="card-title">
        ${escapeHTML(item.name)}
      </div>

      <div class="card-arrow">
        ↗
      </div>
    `;


    grid.appendChild(card);

  });

}


/* =====================================================
   ESCAPE
   ===================================================== */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   SHARE
   ===================================================== */

async function shareSite(){

  const shareData = {

    title:data.en,

    text:
      "Visit Probashi & Youth Welfare Cooperative Society",

    url:window.location.href

  };


  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      showToast("Website link copied!");

    }

  }catch(e){

    console.log(e);

  }

}


/* =====================================================
   ADMIN OPEN
   ===================================================== */

function openAdmin(){

  closeModal("menuModal");

  if(sessionStorage.getItem("BPM_ADMIN") === "YES"){

    loadAdminPanel();

    document
      .getElementById("adminModal")
      .classList.add("show");

  }else{

    document
      .getElementById("loginModal")
      .classList.add("show");

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

function loginAdmin(){

  const username =
    document.getElementById("adminUser").value.trim();

  const password =
    document.getElementById("adminPass").value;


  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem(
      "BPM_ADMIN",
      "YES"
    );

    document.getElementById("loginStatus")
      .textContent="";

    closeModal("loginModal");

    loadAdminPanel();

    document.getElementById("adminModal")
      .classList.add("show");

    document.getElementById("adminUser").value="";
    document.getElementById("adminPass").value="";

  }else{

    document.getElementById("loginStatus")
      .textContent =
      "❌ ভুল Username অথবা Password";

  }

}


/* =====================================================
   ADMIN PANEL
   ===================================================== */

function loadAdminPanel(){

  document.getElementById("editBn").value =
    data.bn;

  document.getElementById("editEn").value =
    data.en;

  document.getElementById("editLocation").value =
    data.location;

  document.getElementById("editDate").value =
    data.date;


  const box =
    document.getElementById("adminLinks");

  box.innerHTML = "";


  data.features.forEach((item,index)=>{

    const div =
      document.createElement("div");

    div.className="admin-item";

    div.innerHTML=`

      <label>
        ${index+1}. ${escapeHTML(item.name)}
      </label>

      <input
        class="input"
        id="link_${index}"
        type="url"
        placeholder="Paste link here"
        value="${escapeHTML(item.url)}">

    `;

    box.appendChild(div);

  });

}


/* =====================================================
   SAVE ADMIN CHANGES
   ===================================================== */

function saveAdminChanges(){

  data.bn =
    document.getElementById("editBn").value.trim()
    || defaultData.bn;

  data.en =
    document.getElementById("editEn").value.trim()
    || defaultData.en;

  data.location =
    document.getElementById("editLocation").value.trim()
    || defaultData.location;

  data.date =
    document.getElementById("editDate").value.trim()
    || defaultData.date;


  data.features.forEach((item,index)=>{

    const input =
      document.getElementById("link_"+index);

    if(input){

      item.url =
        input.value.trim() || "#";

    }

  });


  localStorage.setItem(
    "BPM_FINAL_DATA",
    JSON.stringify(data)
  );


  render();

  showToast("✅ সব পরিবর্তন Save হয়েছে");

  closeModal("adminModal");

}


/* =====================================================
   LOGO CHANGE
   ===================================================== */

function changeLogo(event){

  const file =
    event.target.files[0];

  if(!file)return;


  if(!file.type.startsWith("image/")){

    showToast("শুধু Image নির্বাচন করুন");

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    data.logo =
      e.target.result;

    document.getElementById("logo").src =
      data.logo;

    localStorage.setItem(
      "BPM_FINAL_DATA",
      JSON.stringify(data)
    );

    showToast("✅ Logo পরিবর্তন হয়েছে");

  };


  reader.readAsDataURL(file);

}


/* =====================================================
   LOGOUT
   ===================================================== */

function adminLogout(){

  sessionStorage.removeItem("BPM_ADMIN");

  closeModal("adminModal");

  showToast("Admin Logout হয়েছে");

}


/* =====================================================
   MODAL
   ===================================================== */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


function showMenu(){

  document
    .getElementById("menuModal")
    .classList.add("show");

}


/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.classList.remove("show");

  },2500);

}


/* =====================================================
   HOME
   ===================================================== */

function scrollHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   CLOSE MODAL BY BACKGROUND
   ===================================================== */

document.querySelectorAll(".modal")
.forEach(modal=>{

  modal.addEventListener("click",function(e){

    if(e.target === modal){

      modal.classList.remove("show");

    }

  });

});


/* =====================================================
   START
   ===================================================== */

render();

</script>

</body>
</html>
