<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0218 0%, #1f073b 50%, #0b0218 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-container {
            background: rgba(20, 5, 45, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            padding: 25px 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        /* ১. লোগো */
        .logo-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            overflow: hidden;
            background: #000;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ২. সংগঠনের নাম ও তথ্য */
        .bangla-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .english-title {
            font-size: 0.85rem;
            color: #e2b6ff;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .meta-info {
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* ৩. সবুজ, লাল, হলুদ দাগ */
        .divider-lines {
            width: 100%;
            margin: 20px 0 25px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .line-green { height: 3px; background-color: #006a4e; width: 100%; }
        .line-red   { height: 3px; background-color: #f42a41; width: 100%; }
        .line-yellow{ height: 3px; background-color: #ffd700; width: 100%; }

        /* ৪. আইকন গ্রিড (এক সারিতে ৪টি) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 10px 5px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .card-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 6px;
        }

        .card-label {
            font-size: 0.65rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            line-height: 1.1;
        }

        /* ৫. ভিডিও গ্যালারি (এক সারিতে ৪টি) */
        .section-heading {
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px dashed #ffd700;
            padding-bottom: 5px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 30px;
        }

        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ffd700;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ৬. যোগাযোগ বাটন (ডান থেকে বামে) */
        .contact-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-btn {
            background: #25d366;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
        }

        .contact-btn:hover {
            transform: scale(1.05);
            background: #1eb854;
        }

        @media (max-width: 500px) {
            .features-grid, .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
